name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  # Manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI_CHUNK_SIZE: 65
  IS_PR_CHECK: false

jobs:
  prepare:
    name: Prepare job
    runs-on: 'ubuntu-24.04'
    outputs:
      latestCommitMessage: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
      keystoreBase64: ${{ steps.signing.outputs.keystore_base64 }}
      signingKeyFingerprint: ${{ steps.signing.outputs.signing_key_fingerprint }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set env
        id: set-env
        run: |
          echo "LATEST_COMMIT_MESSAGE<<{delimiter}
          $(git log -1 --pretty=%B)

          Built on commit: $(git log -1 --pretty=%H)
          {delimiter}" >> $GITHUB_OUTPUT

      - name: Find lib changes
        id: modified-libs
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891 # v47.0.1
        with:
          files: lib/
          files_ignore: lib/**.md
          files_separator: " "
          safe_output: false

        # This step is going to commit, but this will not trigger another workflow.
        # If any changes to lib/ caused on master branch, bump the extensions that uses the modified lib.
        # If any changes caused by the merge commit, skip this step because versions should already pumped with that merge.
        # But that should be avoided because our own extensions may not be bumped.
      - name: Bump extensions that uses a modified lib
        if: steps.modified-libs.outputs.any_changed == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
        run: |
          latest_commit_author=$(git log -1 --pretty=%an)
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x ./.github/scripts/bump-versions.py
          ./.github/scripts/bump-versions.py "$COMMIT_MESSAGE" ${{ steps.modified-libs.outputs.all_changed_files }}
          git push

      - name: Set up Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          cache-read-only: true

      - name: Get last successful CI commit
        id: last_successful_ci_commit
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
        with:
          main-branch-name: ${{ github.ref_name }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - id: generate-matrices
        name: Create output matrices
        run: |
          python ./.github/scripts/generate-build-matrices.py ${{ steps.last_successful_ci_commit.outputs.base }} Release

      # Keystore self-signed di-generate SEKALI di sini (bukan di tiap job build),
      # supaya semua extension yang dibuild di matrix chunk manapun ditandatangani
      # pakai key yang SAMA -> signingKeyFingerprint konsisten buat semua APK.
      - id: signing
        name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore signingkey.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias testkey -storepass testpass123 -keypass testpass123 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=ID"
          echo "keystore_base64=$(base64 -w0 signingkey.jks)" >> "$GITHUB_OUTPUT"
          FP=$(keytool -exportcert -alias testkey -keystore signingkey.jks -storepass testpass123 | sha256sum | cut -d' ' -f1)
          echo "signing_key_fingerprint=$FP" >> "$GITHUB_OUTPUT"

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: 'ubuntu-24.04'
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          cache-read-only: ${{ matrix.chunk.number > 1 }}

      # --- Signing key: DI-GENERATE SENDIRI, gak pakai secrets.SIGNING_KEY ---
      # Ini kepakai supaya build gak butuh secret SIGNING_KEY/ALIAS/dll di repo baru.
      # Konsekuensi: keystore beda tiap kali workflow ini jalan ulang dari awal
      # (kalau job ini di-rerun dalam 1 run yang sama, keystore-nya sama karena
      # cuma di-generate sekali per run) -- APK antar RUN yang beda gak akan
      # ke-anggap "update" yang valid oleh Android, jadi kalau install ulang di HP,
      # mungkin perlu uninstall versi lama dulu.
      - name: Prepare signing key
        run: |
          echo "${{ needs.prepare.outputs.keystoreBase64 }}" | base64 -d > signingkey.jks
          chmod 600 signingkey.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build extensions (${{ matrix.chunk.number }})
        env:
          ALIAS: testkey
          KEY_STORE_PASSWORD: testpass123
          KEY_PASSWORD: testpass123
          MEGACLOUD_API: ${{ secrets.MEGACLOUD_API }}
          KISSKH_API: ${{ secrets.KISSKH_API }}
          KISSKH_SUB_API: ${{ secrets.KISSKH_SUB_API }}
          KAISVA: ${{ secrets.KAISVA }}
          TMDB_API: ${{ secrets.TMDB_API }}
        run: |
          ./gradlew $(echo '${{ toJson(matrix.chunk.modules) }}' | jq -r 'join(" ")')

      - name: Upload APKs (${{ matrix.chunk.number }})
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.repository == 'cemmekx096-cmd/Cmd'
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: "**/*.apk"
          retention-days: 1

      - name: Clean up CI files
        run: rm signingkey.jks

  publish:
    name: Publish extension repo
    needs: [prepare, build]
    if: github.repository == 'cemmekx096-cmd/Cmd'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ~/apk-artifacts

      - name: Set up JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: 17
          distribution: temurin

      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref_name }}
          path: ${{ github.ref_name }}

      - name: Create repo artifacts
        run: |
          cd ${{ github.ref_name }}
          python ./.github/scripts/move-built-apks.py
          INSPECTOR_LINK="$(curl -s "https://api.github.com/repos/komikku-app/aniyomi-extensions-inspector/releases/latest" | jq -r '.assets[0].browser_download_url')"
          curl -L "$INSPECTOR_LINK" -o ./Inspector.jar
          java -jar ./Inspector.jar "repo/apk" "output.json" "tmp"
          python ./.github/scripts/create-repo.py

      - name: Checkout repo branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Repo sama, cuma branch beda (bukan repo terpisah lagi)
          repository: ${{ github.repository }}
          ref: build
          token: ${{ secrets.GITHUB_TOKEN }}
          path: repo

      - name: Ensure repo index exists (first run)
        run: |
          if [ ! -f repo/index.min.json ]; then
            echo "[]" > repo/index.min.json
            echo "index.min.json belum ada, dibikin kosong dulu"
          fi
          if [ ! -f repo/index.json ]; then
            echo "[]" > repo/index.json
            echo "index.json belum ada, dibikin kosong dulu"
          fi

      - name: Write repo.json
        run: |
          cat > repo/repo.json << EOF
          {
            "meta": {
              "name": "Cmd",
              "shortName": "Cmd",
              "website": "https://github.com/${{ github.repository }}",
              "signingKeyFingerprint": "${{ needs.prepare.outputs.signingKeyFingerprint }}"
            }
          }
          EOF

      - name: Merge repo
        run: |
          cd repo
          python ../${{ github.ref_name }}/.github/scripts/merge-repo.py '${{ needs.prepare.outputs.delete }}' '${{ github.ref_name }}/repo'

      - name: Deploy repo
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          message: "${{ needs.prepare.outputs.latestCommitMessage }}"
          cwd: "./repo"
          # committer_name: github-actions[bot]
          # committer_email: github-actions[bot]@users.noreply.github.com

      - name: Sync repo
        env:
          COMMIT_MESSAGE: ${{ needs.prepare.outputs.latestCommitMessage }}
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin
          git reset origin/build
          git add -A
          git commit --amend -m "$COMMIT_MESSAGE" --no-sign --allow-empty || echo "No changes to commit"
          git push origin HEAD:build --force

      - name: Purge cached index on jsDelivr
        run: |
          curl "https://purge.jsdelivr.net/gh/${{ github.repository }}@build/index.min.json"
